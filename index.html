<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen — 출시 알림 받기</title>
  <meta name="description" content="Lumen 출시 소식을 가장 먼저 받아보세요." />
  <style>
    :root {
      --bg: #0b0d12; --fg: #eef0f5; --muted: #9aa3b5; --card: #141821;
      --line: #252b38; --accent: #7c5cff; --accent2: #21d4fd; --ok: #3ddc97; --err: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #2a1f66 0%, transparent 60%), var(--bg);
      color: var(--fg); min-height: 100vh; line-height: 1.6;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
    .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
    .logo span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero { text-align: center; padding: 80px 0 64px; }
    .badge { display: inline-block; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1.15; letter-spacing: -0.03em; font-weight: 800; }
    h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: var(--muted); font-size: clamp(16px, 2.4vw, 19px); max-width: 560px; margin: 20px auto 36px; }
    form { display: flex; gap: 8px; max-width: 460px; margin: 0 auto; flex-wrap: wrap; }
    input { flex: 1 1 220px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 16px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { flex: 0 0 auto; padding: 14px 22px; border: 0; border-radius: 12px; font-weight: 600; font-size: 16px; color: #fff; cursor: pointer; background: linear-gradient(90deg, var(--accent), #5b8cff); }
    button:disabled { opacity: .6; cursor: default; }
    #msg { min-height: 24px; margin-top: 14px; font-size: 15px; }
    #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
    .count { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; padding: 24px 0 80px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .card .ico { font-size: 26px; }
    .card h3 { margin: 10px 0 6px; font-size: 18px; }
    .card p { color: var(--muted); font-size: 15px; }
    footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav><div class="logo"><span>Lumen</span></div><div class="count" id="count"></div></nav>

    <section class="hero">
      <div class="badge">✨ 곧 출시됩니다</div>
      <h1>아이디어를 <em>빛나는 결과</em>로<br />더 빠르게</h1>
      <p class="sub">Lumen은 메모, 할 일, 일정을 한 곳에서 정리해주는 가장 단순한 생산성 도구입니다. 이메일을 남기시면 출시 소식을 가장 먼저 알려드릴게요.</p>
      <form id="f" novalidate>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        <button id="btn" type="submit">출시 알림 받기</button>
      </form>
      <div id="msg" role="status"></div>
    </section>

    <section class="features">
      <div class="card"><div class="ico">⚡</div><h3>빠르게</h3><p>단축키 하나로 어디서든 바로 기록하세요.</p></div>
      <div class="card"><div class="ico">🧭</div><h3>단순하게</h3><p>복잡한 설정 없이, 꼭 필요한 기능만 담았습니다.</p></div>
      <div class="card"><div class="ico">🔒</div><h3>안전하게</h3><p>당신의 데이터는 오직 당신만 볼 수 있습니다.</p></div>
    </section>
  </div>
  <footer>© 2026 Lumen · Built with Supabase, GitHub &amp; Vercel</footer>

  <script>
    const SUPABASE_URL = "https://abnsblsmnqmuubcoxiwa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jPbih_yicM6F102gGNOMTg__HXov1-E"; // publishable key — safe to expose
    const headers = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };

    const f = document.getElementById("f"), email = document.getElementById("email"),
          btn = document.getElementById("btn"), msg = document.getElementById("msg"),
          countEl = document.getElementById("count");

    async function loadCount() {
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/waitlist_count`, { method: "POST", headers, body: "{}" });
        if (r.ok) countEl.textContent = `🙌 ${await r.json()}명이 기다리는 중`;
      } catch {}
    }

    function show(text, cls) { msg.textContent = text; msg.className = cls; }

    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = email.value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return show("올바른 이메일 주소를 입력해주세요.", "err");
      btn.disabled = true; show("등록 중…", "");
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/waitlist`, {
          method: "POST", headers: { ...headers, Prefer: "return=minimal" }, body: JSON.stringify({ email: v })
        });
        if (r.ok) { show("등록 완료! 출시되면 가장 먼저 알려드릴게요 🎉", "ok"); email.value = ""; loadCount(); }
        else if (r.status === 409) show("이미 등록된 이메일이에요. 조금만 기다려주세요!", "ok");
        else show("잠시 후 다시 시도해주세요.", "err");
      } catch { show("네트워크 오류가 발생했어요.", "err"); }
      btn.disabled = false;
    });

    loadCount();
  </script>
</body>
</html>
